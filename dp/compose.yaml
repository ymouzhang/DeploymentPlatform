name: dp

services:
  postgres:
    image: ${DP_POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DP_POSTGRES_DB:-dp}"
      POSTGRES_USER: "${DP_POSTGRES_USER:-dp}"
      POSTGRES_PASSWORD: "${DP_POSTGRES_PASSWORD:?请在 .env 中设置 DP_POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  dp:
    image: ${DP_IMAGE:-dp:latest}
    build:
      context: .
      dockerfile: Dockerfile
    platform: ${DP_PLATFORM:-linux/amd64}
    restart: unless-stopped
    init: true
    user: "${DP_UID:-1000}:${DP_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DP_HTTP_PORT:-30199}:30199"
    environment:
      DP_MASTER_KEY: "${DP_MASTER_KEY:?请在 .env 中设置 DP_MASTER_KEY}"
      DP_ADMIN_USERNAME: "${DP_ADMIN_USERNAME:?请在 .env 中设置 DP_ADMIN_USERNAME}"
      DP_ADMIN_PASSWORD: "${DP_ADMIN_PASSWORD:?请在 .env 中设置 DP_ADMIN_PASSWORD}"
      DP_DATABASE_URL: "postgres://${DP_POSTGRES_USER:-dp}:${DP_POSTGRES_PASSWORD}@postgres:5432/${DP_POSTGRES_DB:-dp}?sslmode=disable"
      DP_SESSION_TTL: "${DP_SESSION_TTL:-24h}"
      DP_DATA_DIR: /app/data
      DP_LISTEN_ADDR: 0.0.0.0:30199
      DP_HEALTH_INTERVAL: "${DP_HEALTH_INTERVAL:-10s}"
      DP_UPLOAD_TIMEOUT: "${DP_UPLOAD_TIMEOUT:-10m}"
      DP_UPLOAD_MAX_BYTES: "${DP_UPLOAD_MAX_BYTES:-107374182400}"
      DP_MODEL_UPLOAD_MAX_BYTES: "${DP_MODEL_UPLOAD_MAX_BYTES:-1099511627776}"
      DP_MODEL_UPLOAD_CHUNK_BYTES: "${DP_MODEL_UPLOAD_CHUNK_BYTES:-67108864}"
      DP_MODEL_UPLOAD_RETENTION: "${DP_MODEL_UPLOAD_RETENTION:-72h}"
      DP_MODEL_TRANSFER_TIMEOUT: "${DP_MODEL_TRANSFER_TIMEOUT:-24h}"
      DP_MODEL_TASK_CONCURRENCY: "${DP_MODEL_TASK_CONCURRENCY:-2}"
      DP_LOG_LEVEL: "${DP_LOG_LEVEL:-info}"
      DP_AUDIT_RETENTION_DAYS: "${DP_AUDIT_RETENTION_DAYS:-180}"
      DP_AUDIT_EXPORT_MAX_ROWS: "${DP_AUDIT_EXPORT_MAX_ROWS:-100000}"
      DP_NOTIFICATION_RETENTION_DAYS: "${DP_NOTIFICATION_RETENTION_DAYS:-180}"
      DP_OPERATION_RETENTION_DAYS: "${DP_OPERATION_RETENTION_DAYS:-180}"
      DP_PACKAGE_VERSION_RETENTION: "${DP_PACKAGE_VERSION_RETENTION:-10}"
      DP_TRUSTED_PROXY_CIDRS: "${DP_TRUSTED_PROXY_CIDRS:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:30199/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

volumes:
  postgres-data:
