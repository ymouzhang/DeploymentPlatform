            upload_id: { type: string, format: uuid }
            offset: { type: integer, format: int64 }
            chunk_bytes: { type: integer, format: int64 }
            expires_at: { type: string, format: date-time }
    Operation:
      type: object
      properties:
        id: { type: string, format: uuid }
        service_instance_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        actor_user_id: { type: string, format: uuid }
        actor_username: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        service_instance_name: { type: string }
        service_instance_ip: { type: string }
        service_type: { type: string }
        action: { type: string, enum: [install, start, stop, reset] }
        status:
          type: string
          enum: [queued, running, succeeded, failed, timed_out, interrupted]
        stage: { type: string }
        exit_code: { type: integer }
        error_code: { type: string }
        error_message: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        tags:
          type: array
          description: Immutable labels captured when the operation was created.
          items: { $ref: "#/components/schemas/ResourceTagRef" }
    OperationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Operation"
    OperationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Operation" } }
            next_cursor: { type: string }
    Notification:
      type: object
      required: [id, created_at, risk_level, category, title, message, read, resolved, link]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        risk_level: { type: string, enum: [normal, high] }
        category: { type: string, enum: [security, account, resource, operation, system] }
        title: { type: string }
        message: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        target_label: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        operation_id: { type: string, format: uuid }
        link: { type: string }
        read: { type: boolean }
        resolved: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    NotificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
            next_cursor: { type: string }
    NotificationSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [unread, unresolved]
          properties:
            unread: { type: integer }
            unresolved: { type: integer }
    AdminDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [metrics, communications, notifications]
          properties:
            metrics:
              type: object
              required: [users, enabled_users, disabled_users, packages, hosts, service_instances, installed_services, running_services, active_operations, failed_operations_24h, login_failures_24h, unvalidated_hosts, stale_validation_hosts, unhealthy_installed_services, high_risk_audits_24h, unread_notifications, unread_communications]
              properties:
                users: { type: integer }
                enabled_users: { type: integer }
                disabled_users: { type: integer }
                packages: { type: integer }
                hosts: { type: integer }
                service_instances: { type: integer }
                installed_services: { type: integer }
                running_services: { type: integer }
                active_operations: { type: integer }
                failed_operations_24h: { type: integer }
                login_failures_24h: { type: integer }
                unvalidated_hosts: { type: integer }
                stale_validation_hosts: { type: integer }
                unhealthy_installed_services: { type: integer }
                high_risk_audits_24h: { type: integer }
                unread_notifications: { type: integer }
                unread_communications: { type: integer, description: Unread communication messages for the current account }
            communications:
              type: array
              maxItems: 5
              description: Most recently updated communication threads containing unread messages for the current account
              items: { $ref: "#/components/schemas/Communication" }
            notifications:
              type: array
              items: { $ref: "#/components/schemas/Notification" }
    AuditEvent:
      type: object
      required: [id, occurred_at, category, action, outcome, risk_level, actor_username, actor_roles, request_id]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        category: { type: string, enum: [authentication, authorization, account, package, host, service, model, communication, audit] }
        action: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        risk_level: { type: string, enum: [normal, high] }
        actor_user_id: { type: string, format: uuid }
        actor_username: { type: string }
        actor_roles:
          type: array
          items: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        target_label: { type: string }
        request_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        source_ip: { type: string }
        user_agent: { type: string, maxLength: 512 }
        error_code: { type: string }
        changes:
          type: object
          additionalProperties: true
          description: Allowlisted and sanitized change summary; never contains credentials or configuration content.
    AuditEventResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AuditEvent" }
    AuditEventListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items, next_cursor]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
            next_cursor: { type: string }
    AuditSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [total, failures, login_failures, high_risk]
          properties:
            total: { type: integer }
            failures: { type: integer }
            login_failures: { type: integer }
            high_risk: { type: integer }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        request_id: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated account lacks the route permission or required resource scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State or uniqueness conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request data is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    OperationAccepted:
      description: Asynchronous operation accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  operation_id: { type: string, format: uuid }
                  status: { type: string, const: queued }
