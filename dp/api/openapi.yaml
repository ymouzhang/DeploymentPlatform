openapi: 3.1.0
info:
  title: DP API
  version: 2.0.0
  description: Deployment Platform HTTP API with PostgreSQL-backed Core RBAC and own/all resource scopes
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      security: []
      servers: [{ url: / }]
      operationId: getHealth
      description: Checks PostgreSQL access and data-directory writability.
      responses:
        "200":
          description: DP is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResponse" }
        "503":
          description: A required local dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeResponse" }
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in; sets the HttpOnly session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Credentials are correct but the account is disabled (`ACCOUNT_DISABLED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Username or source IP is temporarily throttled (`LOGIN_THROTTLED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200": { description: Logged out }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /auth/password:
    put:
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Password changed; other sessions revoked }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/sessions:
    get:
      operationId: listOwnSessions
      responses:
        "200":
          description: Active sessions owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeOwnSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Session revoked; the cookie is cleared when revoking the current session }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: User list; requires account.read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      description: Creates an enabled account whose administrator-assigned password must be changed by the account owner at first login. This policy cannot be disabled in the create request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{id}/password:
    put:
      operationId: resetUserPassword
      description: Requires account.update. Only a super_admin may reset another super_admin account.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password, require_password_change]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
                require_password_change: { type: boolean, default: true }
      responses:
        "200": { description: Password reset, forced-change policy updated and sessions revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/status:
    put:
      operationId: updateUserStatus
      description: Requires account.update. Enabling requires at least one role; only a super_admin may change another super_admin account.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Status updated; disabling revokes sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /users/{id}:
    get:
      operationId: getUserDetail
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User detail and resource/activity summary; requires account.read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetailResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteUser
      description: Requires account.delete. Only a super_admin may delete another super_admin account, and one enabled super_admin must remain.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: User deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      description: Requires account.update. Only a super_admin may force another super_admin offline.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: All target-user sessions revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/sessions:
    get:
      operationId: listUserSessions
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Active sessions for the target user; requires account.read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/sessions/{sessionId}:
    delete:
      operationId: revokeUserSession
      description: Requires account.update. Only a super_admin may revoke another super_admin session.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: Target session revoked; requires account.update }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/transfer:
    post:
      operationId: transferUserResources
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_user_id]
              properties:
                target_user_id: { type: string, format: uuid }
      responses:
        "200":
          description: All resources transferred atomically and source sessions revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResultResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/roles:
    put:
      operationId: replaceUserRoles
      description: Requires account.assign_roles. Super-admin assignment changes are restricted to super_admin and one enabled super_admin must remain.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceUserRolesInput" }
      responses:
        "200": { description: User role bindings replaced atomically }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /permissions:
    get:
      operationId: listPermissions
      responses:
        "200":
          description: Immutable permission catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermissionListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /roles:
    get:
      operationId: listRoles
      responses:
        "200":
          description: System and custom roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleInput" }
      responses:
        "201":
          description: Custom role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /roles/{id}:
    get:
      operationId: getRole
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateRole
      parameters:
        - $ref: "#/components/parameters/RoleId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleInput" }
      responses:
        "200":
          description: Custom role and grants replaced atomically
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteRole
      parameters:
        - $ref: "#/components/parameters/RoleId"
      responses:
        "200": { description: Unused custom role deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /hosts:
    get:
      operationId: listHosts
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Host list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostListResponse"
    post:
      operationId: createHost
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInput"
      responses:
        "201":
          description: Host created after SSH and SFTP validation; validation metadata is persisted atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /hosts/{id}:
    put:
      operationId: updateHost
      parameters:
        - $ref: "#/components/parameters/HostId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInput"
      responses:
        "200":
          description: Host updated; changed connection details are validated before persistence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteHost
      parameters:
        - $ref: "#/components/parameters/HostId"
      responses:
        "200":
          description: Host deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            主机仍有关联服务实例（HOST_HAS_SERVICES）
            或模型（HOST_HAS_MODELS），禁止删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/{id}/tags:
    put:
      operationId: replaceServiceInstanceTags
      description: Atomically replaces all tags; every tag must belong to the service instance owner.
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tag_ids]
              properties:
                tag_ids:
                  type: array
                  uniqueItems: true
                  maxItems: 20
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Updated service instance, including tags, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInstanceResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tags:
    get:
      operationId: listResourceTags
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200": { description: Visible account-scoped tag catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceTagListResponse" } } } }
    post:
      operationId: createResourceTag
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceTagInput" }
      responses:
        "201": { description: Tag created, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceTagResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /tags/{id}:
    put:
      operationId: updateResourceTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceTagInput" }
      responses:
        "200": { description: Tag renamed, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceTagResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteResourceTag
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "200": { description: Tag deleted and service instance associations removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /hosts/validate:
    post:
      operationId: validateDraftHost
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostInput"
      responses:
        "200":
          description: SSH validation result, including expected remote failures
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
  /hosts/{id}/validate:
    post:
      operationId: validateSavedHost
      parameters:
        - $ref: "#/components/parameters/HostId"
      responses:
        "200":
          description: SSH validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /hosts/export:
    get:
      operationId: exportHosts
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Versioned host JSON document
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostTransferDocument"
  /hosts/import:
    post:
      operationId: importHosts
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostTransferDocument"
      responses:
        "200":
          description: Atomic import result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [created, overwritten, total]
                    properties:
                      created: { type: integer }
                      overwritten: { type: integer }
                      total: { type: integer }
        "422":
          $ref: "#/components/responses/ValidationError"
  /service-types:
    get:
      operationId: listServiceTypes
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Supported service types
  /packages:
    get:
      operationId: listPackages
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Latest package for every service type
  /service-types/{type}/package:
    parameters:
      - $ref: "#/components/parameters/ServiceType"
      - $ref: "#/components/parameters/OwnerId"
    get:
      operationId: getPackage
      responses:
        "200":
          description: Current package metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: uploadPackage
      description: >
        上传文件时创建不可变版本并设为当前版本；仅传 note 时修改当前版本备注。
        file 与 note 均为可选，但至少提供其一；未传 note 时新版本继承当前版本备注。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                note:
                  type: string
                  maxLength: 200
                  description: 安装包备注（可选）
      responses:
        "200":
          description: Package version accepted and selected as current
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageResponse"
        "413":
          description: Package too large
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deletePackage
      responses:
        "200":
          description: Package deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            该服务类型仍有关联服务实例（PACKAGE_IN_USE），
            需先删除相关服务实例后才允许删除安装包
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /service-types/{type}/package/versions:
    parameters:
      - $ref: "#/components/parameters/ServiceType"
      - $ref: "#/components/parameters/OwnerId"
    get:
      operationId: listPackageVersions
      responses:
        "200":
          description: Immutable package versions ordered newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageVersionListResponse"
        "404": { $ref: "#/components/responses/NotFound" }
  /service-types/{type}/package/versions/{versionId}/current:
    parameters:
      - $ref: "#/components/parameters/ServiceType"
      - $ref: "#/components/parameters/OwnerId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: activatePackageVersion
      responses:
        "200":
          description: Historical compatible version selected as current
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackageResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /service-types/{type}/package/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/ServiceType"
      - $ref: "#/components/parameters/OwnerId"
      - name: versionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deletePackageVersion
      responses:
        "200": { description: Unreferenced non-current version deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /services:
    get:
      operationId: listServices
      parameters:
        - $ref: "#/components/parameters/OwnerId"
        - $ref: "#/components/parameters/TagIds"
        - name: service_type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Service list with cached health state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Service"
    post:
      operationId: createServiceInstance
      parameters: [{ $ref: "#/components/parameters/OwnerId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInstanceInput" } } }
      responses:
        "201": { description: Service instance created, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInstanceResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /services/{id}:
    parameters: [{ $ref: "#/components/parameters/ServiceInstanceId" }]
    put:
      operationId: updateServiceInstance
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInstanceInput" } } }
      responses:
        "200": { description: Service instance updated, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceInstanceResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteServiceInstance
      responses:
        "200": { description: Uninstalled service instance deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /services/{id}/config:
    parameters:
      - $ref: "#/components/parameters/ServiceInstanceId"
    get:
      operationId: getServiceConfig
      responses:
        "200":
          description: Service-instance-specific config, or the package template when not customized
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceConfig" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateServiceConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Raw JSON or YAML matching the package template format
      responses:
        "200":
          description: Saved service-instance-specific config
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ServiceConfig" }
        "422":
          $ref: "#/components/responses/ValidationError"
  /services/{id}/config/preview:
    post:
      operationId: previewServiceConfig
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Validated current and proposed content for a side-by-side diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceConfigPreviewResponse" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /services/{id}/config/revisions:
    get:
      operationId: listServiceConfigRevisions
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "200":
          description: Configuration revision metadata ordered newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceConfigRevisionListResponse" }
  /services/{id}/config/revisions/{revisionId}:
    get:
      operationId: getServiceConfigRevision
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
        - name: revisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Configuration revision including content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceConfigRevisionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /services/{id}/config/revisions/{revisionId}/rollback:
    post:
      operationId: rollbackServiceConfigRevision
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
        - name: revisionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: New rollback revision and current configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceConfigRevisionResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /services/{id}/install:
    post:
      operationId: installService
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
  /services/{id}/start:
    post:
      operationId: startService
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
  /services/{id}/stop:
    post:
      operationId: stopService
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
  /services/{id}/reset:
    post:
      operationId: resetService
      description: Stops the service when needed, resets remote markers, and marks it uninstalled without deleting remote files.
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "202":
          $ref: "#/components/responses/OperationAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
  /services/{id}/health-check:
    post:
      operationId: checkServiceHealth
      description: Requests `http://<service_instance-ip>:<health-port>/healthz`. Only HTTP 200 with `{"status":"ok"}` is healthy.
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
      responses:
        "200":
          description: Health result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResultResponse" }
  /services/{id}/logs/stream:
    get:
      operationId: streamServiceLogs
      description: Streams colored Docker Compose logs over Server-Sent Events.
      parameters:
        - $ref: "#/components/parameters/ServiceInstanceId"
        - name: tail
          in: query
          schema: { type: integer, minimum: 0, maximum: 2000, default: 300 }
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Operation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /operations:
    get:
      operationId: listOperations
      description: Cursor-paginated operation center scoped by operation.read.
      parameters:
        - $ref: "#/components/parameters/OwnerId"
        - $ref: "#/components/parameters/TagIds"
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, enum: [install, start, stop, reset] } }
        - { name: status, in: query, schema: { type: string, enum: [queued, running, succeeded, failed, timed_out, interrupted] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Operation page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /operations/{id}/events:
    get:
      operationId: streamOperationEvents
      parameters:
        - $ref: "#/components/parameters/OperationId"
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      description: Tag filters affect only service_instance, service, SSH-validation and operation metrics. Other metrics keep their permission scope; communication unread state is scoped to the current account.
      parameters:
        - $ref: "#/components/parameters/TagIds"
      responses:
        "200":
          description: Permission-scoped overview metrics, the current account's recent unread communications, and recent actionable risk notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/summary:
    get:
      operationId: getNotificationSummary
      responses:
        "200":
          description: Permission-scoped notification counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSummaryResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: risk_level, in: query, schema: { type: string, enum: [normal, high] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Notification page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Notification marked read }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/{id}/resolve:
    put:
      operationId: resolveNotification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Notification marked read and resolved }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /communications/summary:
    get:
      operationId: getCommunicationSummary
      responses:
        "200":
          description: Per-current-user unread communication message count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationSummaryResponse" }
  /events:
    get:
      operationId: streamRealtimeEvents
      description: One account-scoped SSE connection. Sends `sync` after connect and `communication.changed` invalidation hints after committed communication changes. Event payloads never contain message content. The browser reconnects automatically and authoritative data is fetched from regular APIs.
      responses:
        "200":
          description: Authenticated account event stream with 15-second heartbeats
          headers:
            Cache-Control: { schema: { type: string }, description: Always `no-cache, no-transform` }
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                communicationChanged:
                  value: |-
                    id: 2f79efdf-f764-4d40-9222-f00bba885a1d
                    event: communication.changed
                    data: {"id":"2f79efdf-f764-4d40-9222-f00bba885a1d","type":"communication.changed","resource_id":"e8648ce1-5537-497c-8164-e7a5683b703d","change":"message","occurred_at":"2026-08-14T10:00:00Z"}
        "401": { $ref: "#/components/responses/Unauthorized" }
  /communications:
    get:
      operationId: listCommunications
      parameters:
        - { name: target_user_id, in: query, description: Target-user filter available with communication.read all scope, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
        - { name: unread, in: query, schema: { type: boolean } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: Cursor-paginated communications visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationListResponse" }
    post:
      operationId: createCommunication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationCreateInput" }
      responses:
        "201":
          description: Communication created atomically; requires communication.create
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetailResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /communications/{id}:
    get:
      operationId: getCommunication
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Communication detail, immutable timeline, recipient reads and resource snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetailResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /communications/{id}/read:
    put:
      operationId: markCommunicationRead
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      responses:
        "200":
          description: Current user's inbound messages in this communication marked read idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetailResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /communications/{id}/messages:
    post:
      operationId: sendCommunicationMessage
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        "201":
          description: Admin message or target-user receipt appended to an open communication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationMessageResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /communications/{id}/close:
    post:
      operationId: closeCommunication
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationStateInput" }
      responses:
        "200":
          description: Communication closed and target user notified; requires communication.manage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetailResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /communications/{id}/reopen:
    post:
      operationId: reopenCommunication
      parameters:
        - $ref: "#/components/parameters/CommunicationId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunicationStateInput" }
      responses:
        "200":
          description: Communication reopened with an immutable marker and target-user notification; requires communication.manage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunicationDetailResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /audit-events:
    get:
      operationId: listAuditEvents
      description: Cursor-paginated audit events; requires audit.read.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string, enum: [authentication, authorization, account, package, host, service, model, communication, audit] } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: source_ip, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventListResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /audit-events/summary:
    get:
      operationId: getAuditSummary
      description: Audit totals for the selected filter; requires audit.read.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure, denied] } }
      responses:
        "200":
          description: Audit summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSummaryResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /audit-events/export:
    get:
      operationId: exportAuditEvents
      description: Exports at most 31 days and the configured row limit as UTF-8 CSV; requires audit.export.
      parameters:
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - { name: actor_id, in: query, schema: { type: string, format: uuid } }
        - { name: owner_id, in: query, schema: { type: string, format: uuid } }
        - { name: category, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { type: string, enum: [success, failure, denied] } }
        - { name: source_ip, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        "200":
          description: UTF-8 CSV with BOM
          content:
            text/csv: { schema: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /audit-events/{id}:
    get:
      operationId: getAuditEvent
      description: Gets a sanitized audit event and records the detail view; requires audit.read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Audit event detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /models:
    get:
      operationId: listModels
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      responses:
        "200":
          description: Models visible to the current owner scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelListResponse" }
  /models/{id}:
    get:
      operationId: getModel
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Model detail, content: { application/json: { schema: { $ref: "#/components/schemas/ModelResponse" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteModel
      description: Verifies the remote `.dp-model.json` marker before removing a ready model.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties: { confirm_name: { type: string } }
      responses:
        "200": { description: Uploading or failed model removed synchronously }
        "202": { description: Remote deletion task accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ModelTaskResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /models/{id}/retry:
    post:
      operationId: retryModelDeploy
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Deployment retry accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ModelTaskResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /model-uploads:
    post:
      operationId: createModelUpload
      description: Creates a remote upload staging file on an existing service_instance; DP does not retain a local model copy.
      parameters:
        - $ref: "#/components/parameters/OwnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelUploadCreateInput" }
      responses:
        "201": { description: Upload session created, content: { application/json: { schema: { $ref: "#/components/schemas/ModelUploadCreatedResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /model-uploads/{id}:
    head:
      operationId: getModelUploadOffset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Persisted remote offset
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
    patch:
      operationId: appendModelUploadChunk
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204":
          description: Chunk persisted to the target host
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: cancelModelUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Remote staging file removed and upload cancelled }
  /model-uploads/{id}/complete:
    post:
      operationId: completeModelUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Validation and extraction task accepted, content: { application/json: { schema: { $ref: "#/components/schemas/ModelTaskResponse" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /model-tasks/{id}:
    get:
      operationId: getModelTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Model task snapshot, content: { application/json: { schema: { $ref: "#/components/schemas/ModelTaskResponse" } } } }
  /model-tasks/{id}/events:
    get:
      operationId: streamModelTaskEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Model task state and log events, content: { text/event-stream: { schema: { type: string } } } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp_session
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommunicationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OwnerId:
      name: owner_id
      in: query
      required: false
      description: Owner filter/target available only when the route permission resolves to all scope; own scope is forced to the current account.
      schema: { type: string, format: uuid }
    TagIds:
      name: tag_id
      in: query
      required: false
      description: Repeat to require all selected tags. Tag visibility is checked against the authenticated owner scope.
      schema:
        type: array
        maxItems: 20
        items: { type: string, format: uuid }
      style: form
      explode: true
    TagId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceInstanceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    HostId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceType:
      name: type
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,62}$"
    AuditFrom:
      name: from
      in: query
      required: false
      description: RFC 3339 start time; defaults to 24 hours ago.
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      required: false
      description: RFC 3339 end time; defaults to now.
      schema: { type: string, format: date-time }
  schemas:
    LoginInput:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        password: { type: string, minLength: 1, maxLength: 128 }
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [username, password, role_ids]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z0-9][a-z0-9._-]{2,31}$"
        password: { type: string, minLength: 8, maxLength: 128 }
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    ReplaceUserRolesInput:
      type: object
      additionalProperties: false
      required: [role_ids]
      properties:
        role_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
